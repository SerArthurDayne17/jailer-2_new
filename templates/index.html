<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>

  <!-- Link preview (WhatsApp, Facebook, Messenger, Telegram, LinkedIn) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:image" content="{{ image_url }}">
  <meta property="og:image:width" content="768">
  <meta property="og:image:height" content="1024">
  <meta property="og:url" content="{{ page_url }}">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:image" content="{{ image_url }}">

  <link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #2b1055 0%, #0b0b1a 70%);
      color: #fff;
      font-family: 'Catamaran', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px; overflow-x: hidden;
    }
    .star { position: fixed; color: #ffd700; animation: twinkle 2s infinite ease-in-out; pointer-events: none; }
    @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }

    .tamil {
      font-size: clamp(2rem, 8vw, 3.6rem); font-weight: 900; text-align: center;
      background: linear-gradient(90deg, #ffd700, #ff8c00, #ffd700);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: drop 1s ease-out; line-height: 1.3;
    }
    .photo-wrap {
      margin: 22px 0; padding: 6px; border-radius: 20px;
      background: linear-gradient(135deg, #ffd700, #ff4500, #ffd700);
      box-shadow: 0 0 40px rgba(255, 215, 0, .55);
      animation: zoom 1.2s ease-out;
    }
    .photo-wrap img { display: block; width: min(360px, 82vw); border-radius: 15px; }
    .superstar {
      font-family: 'Bebas Neue', sans-serif; letter-spacing: 6px;
      font-size: clamp(3rem, 14vw, 6rem); color: #ffd700;
      text-shadow: 0 0 12px #ff8c00, 0 0 30px #ff4500;
      animation: glow 1.5s infinite alternate;
    }
    @keyframes drop { from { opacity: 0; transform: translateY(-60px); } to { opacity: 1; transform: none; } }
    @keyframes zoom { from { opacity: 0; transform: scale(.4) rotate(-8deg); } to { opacity: 1; transform: none; } }
    @keyframes glow { from { text-shadow: 0 0 8px #ff8c00, 0 0 20px #ff4500; } to { text-shadow: 0 0 20px #ffd700, 0 0 50px #ff4500; } }
  </style>
</head>
<body>
  <h1 class="tamil">அண்ணன் தான்டா</h1>
  <div class="photo-wrap"><img src="{{ url_for('static', filename='anna.jpg') }}" alt="Super Star"></div>
  <div class="superstar">⭐ SUPER STAR ⭐</div>

  <script>
    for (let i = 0; i < 30; i++) {
      const s = document.createElement('div');
      s.className = 'star'; s.textContent = '★';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = Math.random() * 100 + 'vh';
      s.style.fontSize = (8 + Math.random() * 18) + 'px';
      s.style.animationDelay = Math.random() * 2 + 's';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
